function collectBackup(){
  return {
    app:'Feisal-finance', version: DB_VERSION, exportedAt: new Date().toISOString(),
    accounts: STATE.accounts, transactions: STATE.transactions, categories: STATE.categories,
    goals: STATE.goals, recurring: STATE.recurring, shoppingLists: STATE.shoppingLists, settings: STATE.settings,
  };
}
function exportBackup(){
  const data = collectBackup();
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url; a.download = `Feisal-finance-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exported successfully.');
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ toast('That file is not a valid backup (invalid JSON).', true); e.target.value=''; return; }
    if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)){
      toast('That file does not look like a Feisal Finance backup.', true); e.target.value=''; return;
    }
    openModal({
      title:'Restore backup',
      bodyHTML: `<p style="font-size:13.5px;color:var(--text-dim);margin-bottom:14px;">This backup contains ${data.transactions.length} transaction(s) and ${data.accounts.length} account(s), exported ${data.exportedAt?fmtDateShort(data.exportedAt.slice(0,10)):'previously'}.</p>
      <p style="font-size:13px;color:var(--text-faint);margin-bottom:14px;">Choose how to restore it:</p>
      <div class="field"><label><input type="radio" name="restore-mode" value="merge" checked> Merge — add backup records alongside what's already here</label></div>
      <div class="field"><label><input type="radio" name="restore-mode" value="replace"> Replace — erase current data first, then restore this backup</label></div>`,
      footHTML: `<button class="btn" id="restore-cancel">Cancel</button><button class="btn btn-primary" id="restore-go">Restore</button>`,
    });
    $('#restore-cancel').addEventListener('click', ()=>{ closeModal(); e.target.value=''; });
    $('#restore-go').addEventListener('click', async ()=>{
      const mode = document.querySelector('input[name="restore-mode"]:checked').value;
      try{
        if(mode==='replace'){
          await Promise.all(['accounts','transactions','categories','goals','recurring','shoppinglists'].map(dbClear));
          STATE.accounts=[]; STATE.transactions=[]; STATE.categories=[]; STATE.goals=[]; STATE.recurring=[]; STATE.shoppingLists=[];
        }
        await mergeBackupData(data);
        if(data.settings){
          STATE.settings = Object.assign({}, STATE.settings, data.settings, {id:'app'});
          await saveSettings();
        }
        closeModal(); e.target.value='';
        toast('Financial data restored successfully.');
        applyTheme();
        render();
      }catch(err){
        toast('Something went wrong while restoring this backup.', true);
      }
    });
  };
  reader.readAsText(file);
}

/* =========================================================
   CROSS-DEVICE SYNC (linked local file, e.g. inside a Drive/Dropbox folder)
========================================================= */
const SYNC_SUPPORTED = typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
let syncHandle = null;
let syncTimer = null;

async function mergeLWW(dbStore, stateKey, incoming){
  let changed = false;
  for(const rec of incoming){
    if(!rec || !rec.id) continue;
    const local = STATE[stateKey].find(x=>x.id===rec.id);
    if(!local){
      STATE[stateKey].push(rec);
      await dbPut(dbStore, rec);
      changed = true;
    } else if((rec.updatedAt||0) > (local.updatedAt||0)){
      const idx = STATE[stateKey].indexOf(local);
      STATE[stateKey][idx] = rec;
      await dbPut(dbStore, rec);
      changed = true;
    }
  }
  return changed;
}

/* Remaps any account reference on a record (and, for shopping lists, its trip history) through
   an id map produced by mergeAccounts — used so records from another device still point at the
   right account after two same-named accounts get folded into one. */
function remapAccountRefs(rec, idMap){
  if(rec.accountId && idMap[rec.accountId]) rec.accountId = idMap[rec.accountId];
  if(rec.destinationAccountId && idMap[rec.destinationAccountId]) rec.destinationAccountId = idMap[rec.destinationAccountId];
  if(Array.isArray(rec.history)){
    rec.history = rec.history.map(h=>{
      if(h && h.accountId && idMap[h.accountId]) h.accountId = idMap[h.accountId];
      return h;
    });
  }
  return rec;
}

/* Accounts are matched by id first, then by name (case-insensitive). Two devices that were each
   onboarded on their own generate different UUIDs for "Cash"/"M-Pesa"/"Bank"/"Savings" — without
   this, every sync would duplicate them. Matching incoming accounts folds them into the existing
   one instead, and returns an id map so every other record can be remapped to point at it. */
async function mergeAccounts(incoming){
  const idMap = {};
  let changed = false;
  for(const rec of incoming){
    if(!rec || !rec.id) continue;
    let local = STATE.accounts.find(x=>x.id===rec.id);
    if(!local){
      local = STATE.accounts.find(x=>x.name.trim().toLowerCase()===String(rec.name||'').trim().toLowerCase());
      if(local){
        idMap[rec.id] = local.id;
        if((rec.updatedAt||0) > (local.updatedAt||0)){
          const merged = Object.assign({}, rec, {id:local.id, openingBalance:local.openingBalance});
          const idx = STATE.accounts.indexOf(local);
          STATE.accounts[idx] = merged;
          await dbPut('accounts', merged);
          changed = true;
        }
        continue;
      }
      STATE.accounts.push(rec);
      await dbPut('accounts', rec);
      changed = true;
    } else if((rec.updatedAt||0) > (local.updatedAt||0)){
      const idx = STATE.accounts.indexOf(local);
      STATE.accounts[idx] = rec;
      await dbPut('accounts', rec);
      changed = true;
    }
  }
  return { changed, idMap };
}

/* Categories are referenced by name everywhere else in the app (not id), so duplicates just need
   folding together by type+name — no remapping of other records is required. */
async function mergeCategories(incoming){
  let changed = false;
  for(const rec of incoming){
    if(!rec || !rec.id) continue;
    let local = STATE.categories.find(x=>x.id===rec.id);
    if(!local){
      local = STATE.categories.find(x=>x.type===rec.type && x.name.trim().toLowerCase()===String(rec.name||'').trim().toLowerCase());
      if(local){
        const unionSubs = Array.from(new Set([...(local.subs||[]), ...(rec.subs||[])]));
        if(unionSubs.length !== (local.subs||[]).length){
          local.subs = unionSubs;
          await dbPut('categories', local);
          changed = true;
        }
        continue;
      }
      STATE.categories.push(rec);
      await dbPut('categories', rec);
      changed = true;
    } else if((rec.updatedAt||0) > (local.updatedAt||0)){
      const idx = STATE.categories.indexOf(local);
      STATE.categories[idx] = rec;
      await dbPut('categories', rec);
      changed = true;
    }
  }
  return changed;
}

/* Single entry point used by both manual backup restore and automatic file sync — merges accounts
   and categories with name-based dedupe first, then remaps every other incoming record through the
   resulting account id map before merging it in. */
async function mergeBackupData(data){
  const { changed: accChanged, idMap } = await mergeAccounts(data.accounts||[]);
  const catChanged = await mergeCategories(data.categories||[]);
  const txChanged = await mergeLWW('transactions','transactions', (data.transactions||[]).map(t=>remapAccountRefs(Object.assign({}, t), idMap)));
  const goalsChanged = await mergeLWW('goals','goals', (data.goals||[]).map(g=>remapAccountRefs(Object.assign({}, g), idMap)));
  const recChanged = await mergeLWW('recurring','recurring', (data.recurring||[]).map(r=>remapAccountRefs(Object.assign({}, r), idMap)));
  const listsChanged = await mergeLWW('shoppinglists','shoppingLists', (data.shoppingLists||[]).map(l=>remapAccountRefs(Object.assign({}, l), idMap)));
  return accChanged||catChanged||txChanged||goalsChanged||recChanged||listsChanged;
}

/* One-off cleanup for accounts/categories that were already duplicated by a sync from before
   mergeAccounts/mergeCategories existed. Safe to run any time — it only folds exact name matches
   and remaps every transaction, goal, recurring bill and shopping list pointing at a duplicate. */
async function cleanupDuplicates(){
  const idMap = {};
  const accGroups = {};
  STATE.accounts.forEach(a=>{
    const key = a.name.trim().toLowerCase();
    (accGroups[key]=accGroups[key]||[]).push(a);
  });
  let accMerged = 0;
  for(const key in accGroups){
    const list = accGroups[key].slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(list.length<=1) continue;
    const survivor = list[0];
    for(let i=1;i<list.length;i++){
      idMap[list[i].id] = survivor.id;
      survivor.openingBalance = (Number(survivor.openingBalance)||0) + (Number(list[i].openingBalance)||0);
      accMerged++;
    }
  }
  if(Object.keys(idMap).length){
    STATE.transactions.forEach(t=>remapAccountRefs(t, idMap));
    STATE.goals.forEach(g=>remapAccountRefs(g, idMap));
    STATE.recurring.forEach(r=>remapAccountRefs(r, idMap));
    STATE.shoppingLists.forEach(l=>remapAccountRefs(l, idMap));
    await dbBulkPut('transactions', STATE.transactions);
    await dbBulkPut('goals', STATE.goals);
    await dbBulkPut('recurring', STATE.recurring);
    await dbBulkPut('shoppinglists', STATE.shoppingLists);
    const toDelete = Object.keys(idMap);
    for(const id of toDelete) await dbDelete('accounts', id);
    STATE.accounts = STATE.accounts.filter(a=>!toDelete.includes(a.id));
    const survivorIds = new Set(Object.values(idMap));
    for(const sid of survivorIds){
      const s = STATE.accounts.find(a=>a.id===sid);
      if(s) await dbPut('accounts', stamp(s));
    }
  }

  const catGroups = {};
  STATE.categories.forEach(c=>{
    const key = c.type+'::'+c.name.trim().toLowerCase();
    (catGroups[key]=catGroups[key]||[]).push(c);
  });
  let catMerged = 0;
  const catToDelete = [];
  for(const key in catGroups){
    const list = catGroups[key];
    if(list.length<=1) continue;
    const survivor = list[0];
    const unionSubs = new Set(survivor.subs||[]);
    for(let i=1;i<list.length;i++){
      (list[i].subs||[]).forEach(s=>unionSubs.add(s));
      catToDelete.push(list[i].id);
      catMerged++;
    }
    survivor.subs = Array.from(unionSubs);
    await dbPut('categories', survivor);
  }
  if(catToDelete.length){
    for(const id of catToDelete) await dbDelete('categories', id);
    STATE.categories = STATE.categories.filter(c=>!catToDelete.includes(c.id));
  }
  return { accMerged, catMerged };
}

async function writeSyncFile(){
  if(!syncHandle) return false;
  try{
    const perm = await syncHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return false;
    const writable = await syncHandle.createWritable();
    await writable.write(JSON.stringify(collectBackup(), null, 2));
    await writable.close();
    return true;
  }catch(err){ return false; }
}

async function syncNow(interactive){
  if(!syncHandle) return;
  try{
    let perm = await syncHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted' && interactive) perm = await syncHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ if(interactive) toast('Sync permission was not granted for this file.', true); return; }
    const file = await syncHandle.getFile();
    const text = await file.text();
    let data = null;
    if(text && text.trim()){ try{ data = JSON.parse(text); }catch(e){ data=null; } }
    let anyChange = false;
    if(data && Array.isArray(data.transactions)){
      anyChange = await mergeBackupData(data);
    }
    await writeSyncFile();
    STATE.settings.lastSyncAt = Date.now();
    await saveSettings();
    if(interactive) toast('Synced with linked file.');
    if(anyChange && document.getElementById('page-content')) rerenderPageSilently();
  }catch(err){
    if(interactive) toast('Could not sync right now.', true);
  }
}
function rerenderPageSilently(){
  // refresh visible data without disrupting whatever the user is doing (e.g. typing in a modal)
  if(document.querySelector('.modal-overlay')) return;
  rerenderPage();
}
const scheduleAutoPush = debounce(()=>{ if(syncHandle) syncNow(false); }, 2500);

async function createSyncFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'Feisal-finance-sync.json',
      types: [{description:'Feisal Finance sync file', accept:{'application/json':['.json']}}],
    });
    syncHandle = handle;
    await dbPut('synchandle', {id:'file', handle});
    await writeSyncFile();
    STATE.settings.lastSyncAt = Date.now();
    await saveSettings();
    toast('Sync file created and linked. Save it inside your Drive or Dropbox folder if it isn\'t already.');
    startAutoSync();
    rerenderPage();
  }catch(err){ /* user cancelled */ }
}
async function linkExistingSyncFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'Feisal Finance sync file', accept:{'application/json':['.json']}}],
      multiple: false,
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('Permission to edit that file was not granted.', true); return; }
    syncHandle = handle;
    await dbPut('synchandle', {id:'file', handle});
    await syncNow(true);
    startAutoSync();
    rerenderPage();
  }catch(err){ /* user cancelled */ }
}
async function unlinkSyncFile(){
  syncHandle = null;
  await dbDelete('synchandle','file');
  stopAutoSync();
  toast('Sync file unlinked.');
  rerenderPage();
}
function startAutoSync(){
  stopAutoSync();
  if(!syncHandle) return;
  syncTimer = setInterval(()=>syncNow(false), 20000);
  window.addEventListener('focus', onWindowFocusSync);
  document.addEventListener('visibilitychange', onVisibilitySync);
}
function stopAutoSync(){
  if(syncTimer){ clearInterval(syncTimer); syncTimer=null; }
  window.removeEventListener('focus', onWindowFocusSync);
  document.removeEventListener('visibilitychange', onVisibilitySync);
}
function onWindowFocusSync(){ if(syncHandle) syncNow(false); }
function onVisibilitySync(){ if(!document.hidden && syncHandle) syncNow(false); }
async function initSync(){
  if(!SYNC_SUPPORTED) return;
  try{
    const rec = await dbGet('synchandle','file');
    if(rec && rec.handle){
      syncHandle = rec.handle;
      startAutoSync();
      syncNow(false);
    }
  }catch(err){ /* ignore */ }
}

  if(!date){ toast('Please choose a date.', true); return; }

  if(type==='transfer'){

  }

    title:`Add funds to ${g.name}`,
    bodyHTML: `
      <div class="field"><label>Amount to add</label><div class="amount-input"><span class="prefix">${STATE.settings.currency}</span><input type="number" id="fund-amount" placeholder="0" step="0.01"></div></div>
      ${g.accountId ? `<div class="field"><label>Move this from</label>
        <select id="fund-source">${sourceOptions.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
        <p class="hint">This will also record a transfer into ${esc(accountName(g.accountId))}.</p>
      </div>` : `<p class="hint">This goal isn't linked to a savings account, so this only updates its progress — no transaction will be recorded.</p>`}
    `,
    footHTML: `<button class="btn" id="fund-cancel">Cancel</button><button class="btn btn-primary" id="fund-save">Add funds</button>`,
  });
  $('#fund-cancel').addEventListener('click', closeModal);
  $('#fund-save').addEventListener('click', async ()=>{
    const amt = Number($('#fund-amount').value);
    if(!amt || amt<=0){ toast('Enter an amount greater than 0.', true); return; }
    if(g.accountId){
      const src = $('#fund-source').value;
      if(!src){ toast('Choose a source account.', true); return; }
      const t = { id:uid(), type:'transfer', amount:amt, date:todayISO(), time:nowTime(),
        category:'Transfer', subcategory:'', accountId:src, destinationAccountId:g.accountId,
        note:`Goal: ${g.name}`, createdAt:Date.now(), updatedAt:Date.now(), deleted:false };
      await dbPut('transactions', t); STATE.transactions.push(t);
    }
    g.currentAmount = Number(g.currentAmount)+amt;
    if(g.currentAmount>=g.targetAmount) g.status='completed';
    await dbPut('goals', stamp(g));
    closeModal(); toast('Funds added to goal.'); rerenderPage();
  });
}

/* ---------- Recurring modal ---------- */
function openRecurringModal(id){
  const existing = id ? STATE.recurring.find(r=>r.id===id) : null;
  const expCats = categoriesByType('expense');
  const accOptions = activeAccounts(existing?existing.accountId:null);
  const freq = existing ? existing.frequency : 'monthly';
  openModal({
    title: existing ? 'Edit recurring bill' : 'New recurring bill',
    bodyHTML: `
      <div class="field"><label>Name</label><input type="text" id="rec-name" value="${existing?esc(existing.name):''}" placeholder="e.g. Rent"></div>
      <div class="field-row">
        <div class="field"><label>Amount</label><div class="amount-input"><span class="prefix">${STATE.settings.currency}</span><input type="number" id="rec-amount" value="${existing?existing.amount:''}" step="0.01"></div></div>
        <div class="field"><label>Frequency</label>
          <select id="rec-freq">
            <option value="monthly" ${freq==='monthly'?'selected':''}>Monthly</option>
            <option value="weekly" ${freq==='weekly'?'selected':''}>Weekly</option>
            <option value="yearly" ${freq==='yearly'?'selected':''}>Yearly</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="rec-category">${expCats.map(c=>`<option value="${esc(c.name)}" ${existing&&existing.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Account</label><select id="rec-account">${accOptions.map(a=>`<option value="${a.id}" ${existing&&existing.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field" id="rec-dueday-wrap" style="${freq==='weekly'?'display:none;':''}"><label>Day of month due (1-28)</label><input type="number" min="1" max="28" id="rec-dueday" value="${existing?existing.dueDay||1:1}"></div>
        <div class="field"><label>Start date</label><input type="date" id="rec-start" value="${existing?existing.startDate:todayISO()}"></div>
      </div>
      <p class="hint" id="rec-weekly-hint" style="${freq==='weekly'?'':'display:none;'}margin-top:-8px;margin-bottom:14px;">Weekly bills repeat every 7 days starting from the date above — no due-day needed.</p>
      <div class="field"><label><input type="checkbox" id="rec-active" ${!existing||existing.active!==false?'checked':''}> Active</label></div>
    `,
    footHTML: `<button class="btn" id="rec-cancel">Cancel</button><button class="btn btn-primary" id="rec-save">${existing?'Save changes':'Create'}</button>`,
  });
  $('#rec-cancel').addEventListener('click', closeModal);
  $('#rec-freq')?.addEventListener('change', (e)=>{
    const isWeekly = e.target.value==='weekly';
    $('#rec-dueday-wrap').style.display = isWeekly ? 'none' : '';
    $('#rec-weekly-hint').style.display = isWeekly ? '' : 'none';
  });
  $('#rec-save').addEventListener('click', async ()=>{
    const name = $('#rec-name').value.trim();
    const amount = Number($('#rec-amount').value);
    if(!name || !amount || amount<=0){ toast('Give it a name and a valid amount.', true); return; }
    const r = {
      id: existing?existing.id:uid(), name, amount, frequency:$('#rec-freq').value,
      category:$('#rec-category').value, subcategory:'', accountId:$('#rec-account').value,
      dueDay:Number($('#rec-dueday').value)||1, startDate:$('#rec-start').value||todayISO(),
      endDate: existing?existing.endDate:null, active:$('#rec-active').checked,
      lastRecordedDate: existing?existing.lastRecordedDate:null,
    };
    await dbPut('recurring', stamp(r));
    const idx = STATE.recurring.findIndex(x=>x.id===r.id);
    if(idx>=0) STATE.recurring[idx]=r; else STATE.recurring.push(r);
    closeModal(); toast(existing?'Recurring bill updated.':'Recurring bill created.'); rerenderPage();
  });
}

/* =========================================================
   PIN LOCK SCREEN
========================================================= */
let pinBuffer = '';
function showLockScreen(){
  const root = $('#lock-root');
  pinBuffer = '';
  root.innerHTML = `
  <div class="lockscreen">
    <div class="brand-mark" style="width:52px;height:52px;font-size:22px;border-radius:16px;">FF</div>
    <h2 style="font-size:17px;">Enter your PIN</h2>
    <div class="pin-dots" id="pin-dots">${'<span class="pin-dot"></span>'.repeat(4)}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
      <button data-n="clear" style="font-size:12px;">Clear</button>
      <button data-n="0">0</button>
      <button data-n="back">⌫</button>
    </div>
    <div id="pin-error" style="color:var(--expense);font-size:12.5px;height:16px;"></div>
    <button class="btn btn-ghost btn-sm" id="forgot-pin-btn" style="margin-top:4px;">Forgot PIN?</button>
  </div>`;
  $$('.pin-pad button').forEach(b=>b.addEventListener('click', ()=>handlePinPress(b.dataset.n)));
  $('#forgot-pin-btn')?.addEventListener('click', handleForgotPin);
}
async function handleForgotPin(){
  const ok = window.confirm('Reset your PIN?\n\nThis removes the PIN lock only. All your accounts, transactions, goals and other data stay exactly as they are.');
  if(!ok) return;
  STATE.settings.pinHash = null;
  await saveSettings();
  $('#lock-root').innerHTML = '';
  render();
}
async function handlePinPress(n){
  if(n==='clear'){ pinBuffer=''; }
  else if(n==='back'){ pinBuffer = pinBuffer.slice(0,-1); }
  else if(pinBuffer.length<4){ pinBuffer += n; }
  $$('#pin-dots .pin-dot').forEach((d,i)=>d.classList.toggle('filled', i<pinBuffer.length));
  if(pinBuffer.length===4){
    const hash = await sha256(pinBuffer);
    if(hash === STATE.settings.pinHash){
      $('#lock-root').innerHTML=''; render();
    } else {
      $('#pin-error').textContent = 'Incorrect PIN, try again.';
      pinBuffer='';
      setTimeout(()=>$$('#pin-dots .pin-dot').forEach(d=>d.classList.remove('filled')),150);
    }
  }
}

/* =========================================================
   RESPONSIVE CHART REDRAW + GLOBAL KEYBOARD HANDLING
========================================================= */
window.addEventListener('resize', debounce(()=>{
  if(!STATE.settings.onboarded) return;
  afterPageRender(UI.route);
}, 200));

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.querySelector('.modal-overlay')) closeModal();
});

/* =========================================================
   INIT
========================================================= */
async function init(){
  try{
    dbInstance = await openDB();
    await loadAll();
  }catch(err){
    document.getElementById('app').innerHTML = `<div class="empty-state" style="padding:60px 20px;"><h3>Could not open local storage</h3><p>Your browser may be blocking IndexedDB (private browsing modes often do). Try a normal browser window.</p></div>`;
    return;
  }
  if(STATE.settings.onboarded && STATE.settings.pinHash){
    showLockScreen();
  } else {
    render();
  }
  initSync();
}
document.addEventListener('DOMContentLoaded', init);
window.__ff_render = render;
})();
</script>
